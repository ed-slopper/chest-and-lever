# Board row X5a. Release builds for Windows, Linux and macOS, made when a tag `v*` is pushed (or by hand),
# attached to a GitHub release as zip files with the game and its assets folder.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: lac.exe
            name: chest-and-lever-windows
          - os: ubuntu-latest
            exe: lac
            name: chest-and-lever-linux
          - os: macos-latest
            exe: lac
            name: chest-and-lever-macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lac-rs
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Packages Bevy needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lac-rs
          key: release
      - run: cargo test -p lac-sim --release --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp target/release/${{ matrix.exe }} dist/${{ matrix.name }}/
          cp -r assets dist/${{ matrix.name }}/
          cp ../README.md dist/${{ matrix.name }}/
          cd dist && 7z a ${{ matrix.name }}.zip ${{ matrix.name }} || zip -r ${{ matrix.name }}.zip ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: lac-rs/dist/${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
